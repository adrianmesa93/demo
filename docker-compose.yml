version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: demo_postgres
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: saas_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: saas_rabbitmq
    ports:
      - "5672:5672"   # Puerto para que Spring envíe mensajes
      - "15672:15672" # Puerto para acceder al panel de control web
    environment:
      RABBITMQ_DEFAULT_USER: saas_rabbit
      RABBITMQ_DEFAULT_PASS: rabbit_password

volumes:
  postgres_data: